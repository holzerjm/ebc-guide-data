# Proves the suggestion bot's credentials are configured, without filing a fake suggestion.
#
# Run it from the Actions tab (Run workflow) after setting up the App, or any time the bot stops
# opening pull requests. It mints a token exactly the way the bot does, checks it can reach this
# repository, and creates and immediately deletes a throwaway ref to prove it can actually write.
# It never opens an issue or a pull request and leaves nothing behind.
name: Verify bot token

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.EBC_APP_ID != '' }}
      HAS_PAT: ${{ secrets.EBC_BOT_PAT != '' }}
    steps:
      - name: Is anything configured at all?
        run: |
          echo "EBC_APP_ID / EBC_APP_PRIVATE_KEY set : $HAS_APP"
          echo "EBC_BOT_PAT set                      : $HAS_PAT"
          if [ "$HAS_APP" != "true" ] && [ "$HAS_PAT" != "true" ]; then
            echo "::error::No bot credentials. Set EBC_APP_ID + EBC_APP_PRIVATE_KEY, or EBC_BOT_PAT. See MAINTAINING.md."
            exit 1
          fi

      # Asking for these two permissions explicitly is itself the test: if the App was not granted
      # Contents and Pull requests read/write, minting the token fails here with a clear message.
      - name: Mint a token the way the bot does
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.EBC_APP_ID }}
          private-key: ${{ secrets.EBC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: What that failure usually means
        if: failure() && steps.app.outcome == 'failure'
        run: |
          cat <<'MSG'
          The token could not be minted. The usual causes, in order:

          "Integration must generate a public key"
              The App ID and the private key belong to different apps, or that app has no key.
              Open the app's settings page: the App ID is at the top, and "Private keys" is further down.
              Both secrets must come from that same page. Generate a key there if the section is empty.

          "A JSON web token could not be decoded" / "invalid key"
              EBC_APP_PRIVATE_KEY is not the whole file. Paste the entire .pem including the
              -----BEGIN RSA PRIVATE KEY----- and -----END RSA PRIVATE KEY----- lines.

          "resource not accessible" / the next step says it cannot write
              The app exists but is not installed on this repository, or lacks a permission.
              Sidebar -> Install App, choose this repository, and give it Contents and
              Pull requests: Read and write.
          MSG
          exit 1

      - name: Can it see this repository, and can it write?
        env:
          BOT_TOKEN: ${{ steps.app.outputs.token || secrets.EBC_BOT_PAT }}
          R: ${{ github.repository }}
        run: |
          set -euo pipefail
          PERMS=$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$R" --jq '.permissions | "push=\(.push) pull=\(.pull)"' 2>/dev/null || echo "push=false pull=false")
          echo "Repository access: $PERMS"
          case "$PERMS" in
            *push=true*) ;;
            *pull=true*)
              echo "::error::The token can read $R but not write to it. The app IS installed here, but is missing a permission: open the app's settings, set Contents and Pull requests to 'Read and write', then accept the new permissions on the installation (GitHub shows a banner until you do)."
              exit 1 ;;
            *)
              echo "::error::The token has no access to $R at all (it cannot even read it). The app is installed somewhere, since the token minted, but not on this repository. Go to https://github.com/settings/installations, Configure the app, and under 'Repository access' add ebc-guide-data."
              exit 1 ;;
          esac

          SHA=$(GH_TOKEN="$BOT_TOKEN" gh api "repos/$R/commits/${{ github.ref_name }}" --jq .sha)
          GH_TOKEN="$BOT_TOKEN" gh api -X POST "repos/$R/git/refs" -f ref=refs/heads/bot-selftest -f sha="$SHA" --silent
          echo "Created refs/heads/bot-selftest — the token can push."
          GH_TOKEN="$BOT_TOKEN" gh api -X DELETE "repos/$R/git/refs/heads/bot-selftest" --silent
          echo "Deleted it again — nothing left behind."

          echo
          echo "The bot's credentials are working. A suggestion labelled bot:draft will open a pull request."
